<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>avar2 Modern Kerning Visualizer</title>
    <style>
        @font-face {
            font-family: 'AvarTestFont';
            src: url('avar2_kern_test.ttf') format('truetype');
        }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            background: #ffffff;
            color: #000000;
        }
        #display {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }
        .test-case {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .label {
            font-size: 1.2rem;
            font-family: sans-serif;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .glyphs {
            font-family: 'AvarTestFont';
            font-size: 15rem; /* Reduced to fit both test cases */
            line-height: 1;
        }
        .controls {
            margin-top: 3rem;
            width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        .slider-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
        }
        input[type=range] {
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="display">
        <div class="test-case" id="auto-case">
            <span class="glyphs">&#x2316;&#x2316;</span>
        </div>
        <div class="test-case" id="manual-case" style="color: gray;">
            <span class="glyphs">&#x2316;&#x2316;</span>
        </div>
        <div class="test-case">
            <span class="glyphs">&#x2316; &#x2316;</span>
        </div>
    </div>

    <div class="controls">
        <div class="slider-header">
            <span>CKRN</span>
            <span id="ckrnVal">0.00</span>
        </div>
        <input type="range" id="ckrnSlider" min="0" max="100" value="0" step="1">

        <div class="slider-header" style="margin-top: 1rem;">
            <span>XKRN</span>
            <span id="xkrnVal">0.000</span>
        </div>
        <input type="range" id="xkrnSlider" min="0" max="1000" value="0" step="1">

        <div class="slider-header" style="margin-top: 1rem;">
            <span>YKRN</span>
            <span id="ykrnVal">0.000</span>
        </div>
        <input type="range" id="ykrnSlider" min="0" max="1000" value="0" step="1">
    </div>

    <script>
        const ckrnSlider = document.getElementById('ckrnSlider');
        const xkrnSlider = document.getElementById('xkrnSlider');
        const ykrnSlider = document.getElementById('ykrnSlider');
        
        const autoCase = document.getElementById('auto-case');
        const manualCase = document.getElementById('manual-case');
        
        const ckrnValDisp = document.getElementById('ckrnVal');
        const xkrnValDisp = document.getElementById('xkrnVal');
        const ykrnValDisp = document.getElementById('ykrnVal');

        // Parse CKRN GET parameter
        const urlParams = new URLSearchParams(window.location.search);
        const ckrnParam = urlParams.get('CKRN');
        if (ckrnParam !== null) {
            const val = parseFloat(ckrnParam);
            if (!isNaN(val) && val >= 0 && val <= 1) {
                ckrnSlider.value = val * 100;
            }
        }

        function update() {
            const ckrnVal = ckrnSlider.value / 100;
            const xkrnVal = xkrnSlider.value / 1000;
            const ykrnVal = ykrnSlider.value / 1000;

            ckrnValDisp.textContent = ckrnVal.toFixed(2);
            xkrnValDisp.textContent = xkrnVal.toFixed(3);
            ykrnValDisp.textContent = ykrnVal.toFixed(3);
            
            autoCase.style.fontVariationSettings = `'CKRN' ${ckrnVal}`;
            manualCase.style.fontVariationSettings = `'XKRN' ${xkrnVal}, 'YKRN' ${ykrnVal}`;
        }

        ckrnSlider.addEventListener('input', update);
        xkrnSlider.addEventListener('input', update);
        ykrnSlider.addEventListener('input', update);

        if (ckrnParam !== null) {
            update();
        } else {
            update(); // Initial call to set defaults
        }
    </script>
</body>
</html>
